name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check Python compilation
        run: python -m compileall -q src tests migrations

      - name: Check Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            mapfile -t files < <(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- '*.py')
          else
            mapfile -t files < <(git diff --name-only HEAD^ HEAD -- '*.py')
          fi

          if ((${#files[@]})); then
            ruff format --check "${files[@]}"
          else
            echo "No changed Python files to format-check."
          fi

      - name: Run test suite
        run: pytest -v --tb=short --junitxml=pytest-results.xml

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: ignore

      - name: Validate Alembic migrations
        env:
          SIE_ENVIRONMENT: test
          SIE_DATABASE_URL: sqlite+aiosqlite:///./ci_migrations.db
        run: alembic upgrade head

      - name: Verify migration state
        env:
          SIE_ENVIRONMENT: test
          SIE_DATABASE_URL: sqlite+aiosqlite:///./ci_migrations.db
        run: alembic check
