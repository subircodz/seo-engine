[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seo-intelligence-engine"
dynamic = ["version"]
description = "Evidence-backed SEO, Answer Engine Optimization (AEO), and Generative Engine Optimization (GEO) intelligence engine for search visibility analysis."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Subir Sutradhar" }]
license = { text = "Apache-2.0" }
keywords = [
    "seo",
    "technical seo",
    "seo audit",
    "seo crawler",
    "search visibility",
    "search intelligence",
    "serp analysis",
    "ai overview",
    "google ai overviews",
    "answer engine optimization",
    "generative engine optimization",
    "geo",
    "ai search visibility",
    "llm visibility",
    "competitor analysis",
    "entity seo",
    "site architecture",
    "python",
    "fastapi",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "redis>=5.0",
    "alembic>=1.13",
    "rich>=13.7",
]

[project.optional-dependencies]
weasyprint = [
    "weasyprint>=62",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pip-audit>=2.7",
]

[project.scripts]
sie = "sie.__main__:main"

[tool.hatch.version]
path = "src/sie/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "network: tests that require real internet access (deselected by default)",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = [".env.example"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
